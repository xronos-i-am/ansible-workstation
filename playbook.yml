---
- name: setup workstation
  connection: local
  become: yes
  hosts: localhost

  pre_tasks:
    - locale_gen: name=ru_RU.UTF-8 state=present
    - locale_gen: name=en_US.UTF-8 state=present

  vars:
    codename: "{{ansible_facts['distribution_release']}}"
    ubuntu_version: "{{ansible_facts['distribution_version']}}"
    user_path: "~{{user}}"
    home_path: "{{user_path | expanduser}}"

  vars_prompt:
    - name: user
      prompt: "Set user"
      default: "dev" 
      private: false 

  tasks:
    - debug: msg="Ubuntu {{ubuntu_version}} / {{codename}}"
    - debug: msg="Username {{user}}"
    - include_tasks: tasks/packages.yml

  roles:
    - { role: chrony }
    #- { role: mono }
    - { role: google_chrome }
    - { role: doublecmd }
    - { role: git }
    # - { role: opera }
    - { role: grub }
    - { role: i386 }
    - { role: telegram }
    - { role: keepassxc }
    #- { role: keyboard_shortcuts }
    - { role: sublime_text }
    - { role: yandex_disk_indicator }
    # - { role: tor_browser }
    # - { role: wine }
    # - { role: zoom }
